<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Spiritual Healing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h2>Contact Us</h2>
  
  <form id="contactForm">
    <input type="text" id="name" placeholder="Full Name" required><br>
    <input type="email" id="email" placeholder="Email Address" required><br>
    <input type="tel" id="phone" placeholder="+91XXXXXXXXXX" required><br>
    <textarea id="message" placeholder="Your Message" required></textarea><br>

    <!-- OTP -->
    <div id="recaptcha-container"></div>
    <input type="text" id="otp" placeholder="Enter OTP">
    <button type="button" onclick="sendOTP()">Send OTP</button>
    <button type="button" onclick="verifyOTP()">Verify OTP</button>

    <button type="submit">Submit</button>
  </form>

  <p id="formMessage"></p>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    // 🔹 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCjduPnewYPgA6iM2kHB_lsKFfBn7oWTU0",
      authDomain: "spiritly-ae536.firebaseapp.com",
      projectId: "spiritly-ae536",
      storageBucket: "spiritly-ae536.appspot.com",
      messagingSenderId: "160769508942",
      appId: "1:160769508942:web:862821c14fa564babce51f",
      measurementId: "G-VMEC3LZKJ9"
    };

    // 🔹 Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // 🔹 Setup Recaptcha
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      'size': 'invisible'
    });

    // 🔹 Send OTP
    function sendOTP() {
      const phoneNumber = document.getElementById("phone").value;
      const appVerifier = window.recaptchaVerifier;

      auth.signInWithPhoneNumber(phoneNumber, appVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          alert("OTP sent!");
        }).catch((error) => {
          alert("Error: " + error.message);
        });
    }

    // 🔹 Verify OTP
    function verifyOTP() {
      const code = document.getElementById("otp").value;
      window.confirmationResult.confirm(code).then((result) => {
        const user = result.user;
        db.collection("users").doc(user.uid).set({
          phoneNumber: user.phoneNumber,
          createdAt: new Date()
        });
        alert("Phone verified!");
      }).catch((error) => {
        alert("OTP failed: " + error.message);
      });
    }

    // 🔹 Contact Form Save
    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const message = document.getElementById("message").value;

      try {
        await db.collection("contactusp").add({
          name,
          email,
          message,
          timestamp: new Date()
        });
        document.getElementById("formMessage").textContent = "✅ Message Sent!";
        document.getElementById("contactForm").reset();
      } catch (err) {
        document.getElementById("formMessage").textContent = "❌ Error: " + err.message;
      }
    });
  </script>
</body>
</html>
