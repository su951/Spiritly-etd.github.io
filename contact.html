<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Spiritual Healing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
   /* General page */
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #e0f7fa, #e8eaf6, #f3e5f5);
  margin: 0;
  padding: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Contact form container */
form {
  background: rgba(255, 255, 255, 0.7);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
  width: 100%;
  max-width: 420px;
  backdrop-filter: blur(10px);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

form:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
}

/* Heading */
h2 {
  text-align: center;
  color: #4a148c;
  margin-bottom: 20px;
  font-family: 'Playfair Display', serif;
  letter-spacing: 1px;
}

/* Input fields & textarea */
input, textarea {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 15px;
  background: rgba(255, 255, 255, 0.9);
  transition: all 0.3s ease;
}

input:focus, textarea:focus {
  outline: none;
  border-color: #7b1fa2;
  box-shadow: 0 0 8px rgba(123, 31, 162, 0.3);
}

/* Buttons */
button {
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  background: linear-gradient(135deg, #7b1fa2, #512da8);
  color: white;
  font-weight: bold;
  transition: background 0.3s, transform 0.2s;
}

button:hover {
  background: linear-gradient(135deg, #6a1b9a, #4527a0);
  transform: scale(1.02);
}

/* Form message */
#formMessage {
  text-align: center;
  margin-top: 12px;
  font-weight: bold;
  color: #2e7d32;
}

/* Hidden button */
.hidden {
  display: none;
}

/* Recaptcha container spacing */
#recaptcha-container {
  margin: 15px 0;
  display: flex;
  justify-content: center;
}

/* Small fade-in animation for form */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

form {
  animation: fadeIn 0.8s ease forwards;
}
  </style>
</head>
<body>
  <form id="contactForm">
    <h2>Contact Us</h2>
    
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="tel" id="phone" placeholder="+91XXXXXXXXXX" required>
    <textarea id="message" placeholder="Your Message" required></textarea>

    <!-- Captcha -->
    <div id="recaptcha-container"></div>

    <!-- OTP Section -->
    <div id="captcha container"></div>
    <input type="text" id="otp" placeholder="Enter OTP">
    <button type="button" onclick="sendOTP()">Send OTP</button>
    <br></br>
    <button type="button" onclick="verifyOTP()">Verify OTP</button>

    <!-- Submit button (hidden until verification) -->
    <button type="submit" id="submitBtn" class="hidden">Submit</button>

    <p id="formMessage"></p>
  </form>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
 
  <script>
      // 🔹 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCjduPnewYPgA6iM2kHB_lsKFfBn7oWTU0",
    authDomain: "spiritly-ae536.firebaseapp.com",
    projectId: "spiritly-ae536",
    storageBucket: "spiritly-ae536.appspot.com",
    messagingSenderId: "160769508942",
    appId: "1:160769508942:web:862821c14fa564babce51f",
    measurementId: "G-VMEC3LZKJ9"
  };

  // 🔹 Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // 🔹 Setup reCAPTCHA
  window.onload = function () {
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
      size: 'normal',
      callback: function (response) {
        console.log("Recaptcha verified");
      }
    });
    recaptchaVerifier.render();
  }

  // 🔹 Send OTP
  function sendOTP() {
    const phoneNumber = document.getElementById("phone").value;
    const appVerifier = window.recaptchaVerifier;

    auth.signInWithPhoneNumber(phoneNumber, appVerifier)
      .then(function (confirmationResult) {
        window.confirmationResult = confirmationResult;
        alert("✅ OTP sent to your phone!");
      })
      .catch(function (error) {
        alert("❌ Error: " + error.message);
      });
  }

  // 🔹 Verify OTP
  function verifyOTP() {
    const code = document.getElementById("otp").value;
    window.confirmationResult.confirm(code)
      .then(function (result) {
        const user = result.user;

        // Save phone verification to Firestore
        db.collection("users").doc(user.uid).set({
          phoneNumber: user.phoneNumber,
          createdAt: new Date()
        });

        alert("✅ Phone verified successfully!");

        // Show Submit button
        document.getElementById("submitBtn").classList.remove("hidden");
      })
      .catch(function (error) {
        console.error(error);
        alert("❌ OTP verification failed: " + error.message);
      });
  }

  // 🔹 Save Contact Form Data
  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const message = document.getElementById("message").value;
    const phone = document.getElementById("phone").value;

    try {
      await db.collection("contactusp").add({
        name,
        email,
        message,
        phone,
        timestamp: new Date()
      });
      document.getElementById("formMessage").textContent = "✅ Message Sent!";
      document.getElementById("contactForm").reset();
      document.getElementById("submitBtn").classList.add("hidden"); // hide again
    } catch (err) {
      document.getElementById("formMessage").textContent = "❌ Error: " + err.message;
    }
  });
  </script>
</body>
</html>
