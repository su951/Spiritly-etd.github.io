<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Spiritual Healing</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Base Styles */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #e0f7fa, #fff3e0);
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background: #ffffffcc;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.01);
    }

    h2 {
      text-align: center;
      color: #4db6ac;
      font-size: 28px;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #555;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      transition: border-color 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #4db6ac;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #4db6ac;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #00897b;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .footer-note {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #888;
    }

    /* Optional animation */
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .container {
      animation: fadeIn 1s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Contact Us</h2>
    <p class="subtitle">Feel free to reach out for guidance, healing sessions, or spiritual advice</p>

    <form id="contactForm">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input type="text" id="name" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" placeholder="example@domain.com" required>
      </div>
      <div class="form-group">
        <label for="topic">Type of Healing Needed</label>
        <select id="topic">
          <option value="">-- Select an option --</option>
          <option>Emotional Healing</option>
          <option>Stress Relief</option>
          <option>Chakra Balancing</option>
          <option>Relationship Guidance</option>
          <option>Past Life Regression</option>
        </select>
      </div>
      <div class="form-group">
        <label for="message">Your Message *</label>
        <textarea id="message" placeholder="Describe your concern or how we can help..." rows="5" required></textarea>
      </div>
      <div class="form-group">
        <button type="submit">Send Your Message ✨</button>
      </div>
    </form>

    <div class="message" id="formMessage"></div>
    <div class="footer-note">🕉️ We are here to help you heal and grow spiritually 🌿</div>
  </div>


<<script type="module">
  // Import the necessary functions from the Firebase modular SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
  import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-analytics.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCjduPnewYPgA6iM2kHB_lsKFfBn7oWTU0",
    authDomain: "spiritly-ae536.firebaseapp.com",
    projectId: "spiritly-ae536",
    storageBucket: "spiritly-ae536.firebasestorage.app",
    messagingSenderId: "160769508942",
    appId: "1:160769508942:web:d447c0a8e102a441bce51f",
    measurementId: "G-7L4XXDTS4C"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const analytics = getAnalytics(app);

  document.addEventListener('DOMContentLoaded', function() {
    const contactForm = document.getElementById('contactForm');
    const formMessage = document.getElementById('formMessage');

    if (!contactForm) return;

    // Single async event listener for form submission
    contactForm.addEventListener('submit', async function(event) {
      event.preventDefault();

      // Get form values
      const name = contactForm['name'].value;
      const email = contactForm['email'].value;
      const topic = contactForm['topic'].value;
      const message = contactForm['message'].value;
      
      // Basic validation
      if (!name || !email || !message) {
        formMessage.style.color = 'red';
        formMessage.textContent = 'Please fill out all required fields.';
        return;
      }

      // UI Loading state
      const submitBtn = contactForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        // Save to Firestore using modular functions
        const docRef = await addDoc(collection(db, 'contactusp'), {
          name: name,
          email: email,
          topic: topic,
          message: message,
          timestamp: serverTimestamp()
        });

        // Log a success message to the console
        console.log("Document successfully written with ID: ", docRef.id);
        
        // Analytics (using modular function)
        logEvent(analytics, 'contact_form_submitted');

        // Success action
        formMessage.style.color = 'green';
        formMessage.textContent = "🙏 Thank you! Your message has been received. We'll contact you soon.";
        contactForm.reset();

        // After successful submission, redirect to WhatsApp
        redirectToWhatsApp();

      } catch (e) {
        console.error("Error adding document: ", e);
        formMessage.style.color = 'red';
        formMessage.textContent = 'An error occurred. Please try again later.';
      } finally {
        // Reset UI state
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Your Message ✨';
      }
    });

    // Helper function to redirect to WhatsApp
    function redirectToWhatsApp() {
      const whatsappGroupLink = "https://chat.whatsapp.com/your-group-link"; // Replace with your link
      window.location.href = whatsappGroupLink;
    }
  });

</script>
</body>
</html>
