<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Spiritual Healing Website</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo-container">
                <div class="logo">
                    <img src="logo.png" alt="spiritly Logo">
                </div>
                <div class="menu-toggle" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </div>
                <ul id="nav-links">
                    <li><a href="footprints.html">Footprints</a></li>
                    <li class="dropdown">
                        <a href="privileges.html">Privileges</a>
                        <div class="dropdown-content">
                            <a href="yoga.html">Yoga</a>
                            <a href="meditation.html">Meditation</a>
                            <a href="prayer.html">Prayer</a>
                            <div class="sub-dropdown">
                                <a href="mantra.html">Mantra Chanting</a>
                                <div class="sub-dropdown-content">
                                    <a href="mrityunjaya.html">Mahamrityunjaya</a>
                                    <a href="gayatrimantra.html">Gayatri Mantra</a>
                                    <a href="durga.html">Durga Dvatrimsha Namavali</a>
                                </div>
                            </div>
                        </div>
                    </li>
                    <li><a href="testimonials.html">Soul Stories</a></li>
                    <li><a href="contact.html">Connect</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="page-wrapper">
        <div class="videoContainer">
            <video autoplay muted loop id="bg-video">
                <source src="spiritly.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="floating-buttons">
            <button class="floating-btn left-btn" onclick="location.href='privileges.html'">Discover Healing</button>
            <button class="floating-btn right-btn" onclick="location.href='contact.html'">Reserve Your Space</button>
        </div>
    </main>

    <footer id="footer">
        <div>Follow us on:</div>
        <div class="social-icons">
            <a href="https://www.youtube.com/@spiritualheelingpunamjee" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
        <div>&copy; 2025 Spiritly. All Rights Reserved.</div>
    </footer>

    <script src="index.js"></script>
    <script>
        // Hamburger menu functionality
        const menuToggle = document.getElementById('menu-toggle');
        const navLinks = document.getElementById('nav-links');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Show footer on scroll
        const footer = document.getElementById('footer');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 100) { // Change 100 to the desired scroll position
                footer.style.visibility = 'visible';
                footer.style.opacity = '1';
            } else {
                footer.style.visibility = 'hidden';
                footer.style.opacity = '0';
            }
        });
    </script>
</body>
</html>
